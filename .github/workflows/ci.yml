name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Syntax check
        run: |
          node --version
          for f in scripts/*.mjs; do node --check "$f"; done

      - name: Validate policy JSON
        run: |
          node -e "for (const f of ['policy/compromised.json','policy/example.approved.json','policy/example.deps-policy.json']) { JSON.parse(require('node:fs').readFileSync(f, 'utf8')); console.log('ok', f); }"

      - name: Tests
        run: TMPDIR="$RUNNER_TEMP" node --test tests/*.test.mjs
