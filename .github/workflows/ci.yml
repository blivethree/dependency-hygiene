name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Syntax check
        run: |
          node --version
          for f in scripts/*.mjs; do node --check "$f"; done

      - name: Validate policy JSON
        run: |
          node -e "for (const f of ['policy/compromised.json','policy/example.approved.json','policy/example.deps-policy.json']) { JSON.parse(require('node:fs').readFileSync(f, 'utf8')); console.log('ok', f); }"

      - name: GitHub Actions pin policy
        run: node scripts/ghacheck.mjs . --fail
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tests
        run: TMPDIR="$RUNNER_TEMP" node --test tests/*.test.mjs
